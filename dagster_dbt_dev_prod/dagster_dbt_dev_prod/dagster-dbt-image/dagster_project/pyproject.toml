[project]
name = "dagster_dbt_projects_changename"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.9",
    "dagster-dbt>=0.29.9",
    "dagster-webserver==1.13.9",
    "dbt-core>=1.11.11",
    "dbt-postgres>=1.10.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg2>=2.9.12",
    "pytest>=9.1.0",
    "dagster-dg-cli==1.13.9",
    "dagster-postgres>=0.29.9",
    "xlrd>=2.0.2"
]

[dependency-groups]
dev = [
    "dagster-dg-cli"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_dbt_projects_changename"
registry_modules = [
    "dagster_dbt_projects_changename.*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]